changelog = """
The overlay, on Horizon's screen hooks (hook points version 313 and later). Everything 0.1.0 did is still here.

### Bookmarks
- Added the **A** key: it bookmarks the stack under the pointer, over a panel item or any slot of a container screen.
- Added the bar: two columns of twelve at the screen's top left corner, each slot showing its stack and, on hover, the item's name and its actions.
- The left button opens a bookmark's recipes, the right one its uses, shift-click or the middle button takes it away, and dragging a slot moves it.
- The bar is kept in `config/jei/bookmarks.txt` and comes back with the next world. A click on the bar is the mod's, never the world's.

### Item Tooltips & Subtypes
- Every tooltip the game shows, the panel's included, now carries `R: Recipes (12)` and `U: Uses (3)` and marks the bookmarked stack with a star.
- The counts are exact: a stack with components counts the recipes the tables name for those components.
- Added subtypes: every `(item, components)` pair the recipe tables name is an item of its own in the list, up to eight variants per item, so the potions and the tipped arrows are there like JEI's subtypes.

### Settings, Config & Commands
- Added the list's order, by name or by id (`/jei sort name|id`), to the mod's settings page.
- Added `config/jei/jei.cfg`, holding the order, the tooltip hints and the bar, and `/jei config` to print the paths of its files.
- Added `/jei bookmarks clear`.
- The search reads the filter once per keystroke and tests every item against it, and the variants are indexed per item.

### Requirements
- Needs hook points version **313** or later (0.1.0 needed 2): it was built and tested on Nightly 2026-11-07, `6560641`."""

